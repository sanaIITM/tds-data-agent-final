services:
  - type: web
    name: tds-data-agent-final
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_BASE_URL
        value: https://openrouter.ai/api/v1
      - key: OPENROUTER_MODEL
        value: google/gemma-4-26b-a4b-it
      - key: LLM_TIMEOUT_SECONDS
        value: '90'
      - key: MAX_UPLOAD_BYTES
        value: '157286400'
      - key: MAX_TOTAL_UPLOAD_BYTES
        value: '157810688'
      - key: MAX_QUESTIONS_BYTES
        value: '524288'
      - key: MAX_ARCHIVE_ENTRIES
        value: '2000'
      - key: MAX_ARCHIVE_UNPACKED_BYTES
        value: '157286400'
